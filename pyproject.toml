[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "neural-canvas"
version = "0.1.0"
description = "A portfolio-quality neural style transfer engine and web UI in PyTorch"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "Neural Canvas Contributors" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "pillow>=9.0.0",
    "numpy>=1.24.0",
    "streamlit>=1.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.3.0",
]

[project.urls]
Homepage = "https://github.com/HiteshDokku/NeuralCanvas"
Repository = "https://github.com/HiteshDokku/NeuralCanvas"
Issues = "https://github.com/HiteshDokku/NeuralCanvas/issues"

[project.scripts]
neural-canvas = "neural_canvas.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["notebooks", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "UP"]
ignore = ["B007", "B008", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
